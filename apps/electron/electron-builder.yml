appId: com.openchic.gouxuan
productName: Gouxuan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.turbo/**'
mac:
  icon: build/icons/gouxuan-v1/Gouxuan.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: 钩玄
  notarize: false
dmg:
  artifactName: Gouxuan-${version}.${ext}
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
