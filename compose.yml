# 本地服务栈。数据库数据使用 named volume，迁移在 API 启动前单独执行。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gouxuan
      POSTGRES_PASSWORD: gouxuan
      POSTGRES_DB: gouxuan
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gouxuan -d gouxuan']
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: ./services/api
    image: gouxuan-api
    command: alembic upgrade head
    environment:
      GOUXUAN_DATABASE_URL: postgresql+psycopg://gouxuan:gouxuan@postgres:5432/gouxuan
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/api
    image: gouxuan-api
    ports:
      - '8000:8000'
    environment:
      GOUXUAN_DATABASE_URL: postgresql+psycopg://gouxuan:gouxuan@postgres:5432/gouxuan
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
